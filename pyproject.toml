[project]
name = "suite-cli"
version = "0.1.0"
description = "Track the git status of every application in your suite."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "platformdirs>=4.3",
    "pyyaml>=6.0",
    "rich>=15.0.0",
]

[project.scripts]
suite = "suite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suite"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "types-pyyaml>=6.0",
    "ty>=0.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
